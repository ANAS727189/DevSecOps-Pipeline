- hosts: all
  become: true

  tasks:
    - name: Wait for SSH
      wait_for_connection:
        timeout: 300

    - name: Install dependencies
      yum:
        name:
          - docker
          - python3-pip
        state: present

    - name: Install Docker SDK for Python
      pip:
        name: docker

    - name: Start and enable Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Run application container
      docker_container:
        name: my-app
        image: "{{ IMAGE_NAME }}"
        state: started
        restart_policy: always
        ports:
          - "80:3000"