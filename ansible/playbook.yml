---
- hosts: all
  become: true

  tasks:
    - name: Wait for SSH to become available
      wait_for_connection:
        timeout: 300

    - name: Install Docker and Python dependencies
      dnf:
        name:
          - docker
          - python3-pip
          - python3-docker  # This replaces the 'pip: name=docker' task
        state: present

    - name: Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Run application container
      docker_container:
        name: my-app
        image: "{{ IMAGE_NAME }}"
        state: started
        restart_policy: always
        # Ensure the socket is available if the module needs it
        docker_host: "unix://var/run/docker.sock"
        ports:
          - "80:3000"